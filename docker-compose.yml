# Local dependencies for GitWatch. No ZooKeeper: Kafka runs in KRaft mode.
# The app profile sets a dev-only encryption key and JWT secret. Do not reuse them outside this compose file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitwatch
      POSTGRES_USER: gitwatch
      POSTGRES_PASSWORD: gitwatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitwatch -d gitwatch"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - gitwatch-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - gitwatch-redis:/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - gitwatch-mongo:/data/db

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      GITWATCH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      GITWATCH_JWT_SECRET: ${GITWATCH_JWT_SECRET:-local-dev-jwt-secret-not-for-production!}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/gitwatch
      DATABASE_USERNAME: gitwatch
      DATABASE_PASSWORD: gitwatch
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongodb:27017/gitwatch
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      GITWATCH_SEED_ENABLED: ${GITWATCH_SEED_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  gitwatch-postgres:
  gitwatch-redis:
  gitwatch-mongo:
