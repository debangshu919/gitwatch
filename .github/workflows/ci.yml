name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # GitWatchApplicationContextTest and RepoPollStateLockTest are Testcontainers
      # tests. GitWatchApplicationContextTest boots Postgres, Redis, Mongo, and Kafka;
      # RepoPollStateLockTest proves SKIP LOCKED. On ubuntu-latest Docker is present,
      # so an unfiltered mvn test would pull images and make this minimum job depend
      # on that. Local mvn test still runs them when Docker is up. A later job can
      # run them. This job must not.
      - name: Run tests
        run: 'bash mvnw -B test -Dtest=!GitWatchApplicationContextTest,!RepoPollStateLockTest'
