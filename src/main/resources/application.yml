spring:
  application:
    name: gitwatch
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gitwatch}
    username: ${DATABASE_USERNAME:gitwatch}
    password: ${DATABASE_PASSWORD:gitwatch}
    hikari:
      data-source-properties:
        stringtype: unspecified
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP_UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gitwatch}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: gitwatch-notifier
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
    admin:
      fail-fast: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

gitwatch:
  encryption-key: ${GITWATCH_ENCRYPTION_KEY:}
  github:
    token: ${GITHUB_TOKEN:}
    api-base: ${GITHUB_API_BASE:https://api.github.com}
    min-remaining: 10
    rate-limit-delay: 15m
  poller:
    enabled: true
    interval-ms: 30000
    batch-size: 10
    next-poll-delay: 3m
    lease: 5m
    max-pages: 5
    page-size: 100
  notifier:
    max-attempts: 3
    backoff: 2s
    timeout: 10s
  seed:
    enabled: false
  mongo:
    log-ttl-days: 90
